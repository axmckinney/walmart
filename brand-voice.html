<!doctype html><html><head><meta charset="utf-8"><title>Voice & tone</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div style="border-left:3px solid var(--ld-green-100);padding-left:14px">
  <div style="font:700 12px/1 var(--ld-font-mono);color:var(--ld-text-positive-bold);text-transform:uppercase;letter-spacing:0.04em">Do</div>
  <div style="font:400 14px/20px var(--ld-font-sans);margin-top:6px">"Add to cart"<br>"Save $3 on fresh produce"<br>"Get it by Thu, Oct 24"<br>"Enter a valid ZIP code"</div>
</div>
<div style="border-left:3px solid var(--ld-red-100);padding-left:14px">
  <div style="font:700 12px/1 var(--ld-font-mono);color:var(--ld-text-negative-bold);text-transform:uppercase;letter-spacing:0.04em">Don't</div>
  <div style="font:400 14px/20px var(--ld-font-sans);margin-top:6px">"Click to purchase"<br>"You can save money on produce!"<br>"Delivery in 4 – 6 days"<br>"The ZIP you entered is invalid"</div>
</div>
</div>
<div class="label" style="margin-top:14px">Second person · active voice · sentence case · no emoji · savings-forward</div>
</div></body></html>

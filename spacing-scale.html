<!doctype html><html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div id="r" style="display:flex;flex-direction:column;gap:6px"></div>
<script>
const stops = [[25,2],[50,4],[100,8],[150,12],[200,16],[250,20],[300,24],[400,32],[500,40],[600,48],[700,56],[800,64],[900,72],[1000,80]];
document.getElementById('r').innerHTML = stops.map(([n,px]) => `
  <div style="display:flex;align-items:center;gap:12px">
    <div class="label" style="width:80px">space-${n}</div>
    <div style="width:40px;text-align:right;font:500 11px/1 var(--ld-font-mono);color:var(--ld-text)">${px}px</div>
    <div style="height:10px;background:var(--ld-blue-100);border-radius:2px;width:${px*4}px"></div>
  </div>`).join('');
</script>
</div></body></html>

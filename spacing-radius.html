<!doctype html><html><head><meta charset="utf-8"><title>Border radius</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px">
<div><div style="height:80px;background:var(--ld-blue-10);border:1px solid var(--ld-blue-20);border-radius:2px"></div><div class="label" style="margin-top:6px">radius-25</div><div class="value">2px · inputs</div></div>
<div><div style="height:80px;background:var(--ld-blue-10);border:1px solid var(--ld-blue-20);border-radius:4px"></div><div class="label" style="margin-top:6px">radius-50</div><div class="value">4px</div></div>
<div><div style="height:80px;background:var(--ld-blue-10);border:1px solid var(--ld-blue-20);border-radius:8px"></div><div class="label" style="margin-top:6px">radius-100</div><div class="value">8px · btn/card</div></div>
<div><div style="height:80px;background:var(--ld-blue-10);border:1px solid var(--ld-blue-20);border-radius:16px"></div><div class="label" style="margin-top:6px">radius-200</div><div class="value">16px · modal</div></div>
<div><div style="height:80px;background:var(--ld-blue-10);border:1px solid var(--ld-blue-20);border-radius:24px"></div><div class="label" style="margin-top:6px">radius-300</div><div class="value">24px</div></div>
<div><div style="height:80px;background:var(--ld-blue-10);border:1px solid var(--ld-blue-20);border-radius:1000px"></div><div class="label" style="margin-top:6px">radius-round</div><div class="value">pill · avatar</div></div>
</div>
</div></body></html>

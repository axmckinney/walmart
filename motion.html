<!doctype html><html><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-family:var(--ld-font-mono);font-size:11px;color:var(--ld-text-subtle)">
<div><div style="font:700 13px/1 var(--ld-font-sans);color:var(--ld-text)">100ms</div>duration-100 · micro</div>
<div><div style="font:700 13px/1 var(--ld-font-sans);color:var(--ld-text)">200ms</div>duration-200 · default hover</div>
<div><div style="font:700 13px/1 var(--ld-font-sans);color:var(--ld-text)">300ms</div>duration-300 · layout</div>
<div><div style="font:700 13px/1 var(--ld-font-sans);color:var(--ld-text)">500ms</div>duration-500 · page</div>
</div>
<div class="hairline" style="margin:16px 0"></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div style="font:700 13px/1 var(--ld-font-sans)">ease-out</div><div class="value">default</div></div>
<div><div style="font:700 13px/1 var(--ld-font-sans)">ease-in</div><div class="value">exit</div></div>
<div><div style="font:700 13px/1 var(--ld-font-sans)">ease-in-out</div><div class="value">transitions</div></div>
<div><div style="font:700 13px/1 var(--ld-font-sans)">linear</div><div class="value">progress</div></div>
</div>
</div></body></html>

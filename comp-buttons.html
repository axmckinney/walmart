<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
.btn{font-family:var(--ld-font-sans);font-weight:700;font-size:16px;line-height:1;padding:12px 20px;border-radius:1000px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background 200ms var(--ld-ease-out),color 200ms var(--ld-ease-out);}
.btn-primary{background:var(--ld-blue-100);color:#fff;}
.btn-primary:hover{background:var(--ld-blue-110);}
.btn-primary:active{background:var(--ld-blue-130);}
.btn-secondary{background:var(--ld-white);color:var(--ld-text);border:1px solid var(--ld-gray-160);}
.btn-secondary:hover{background:var(--ld-gray-5);}
.btn-tertiary{background:transparent;color:var(--ld-text-brand);}
.btn-tertiary:hover{background:var(--ld-blue-10);}
.btn-disabled{background:var(--ld-gray-10);color:var(--ld-gray-50);cursor:not-allowed;}
</style></head>
<body><div class="card">
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <button class="btn btn-primary">Add to cart</button>
  <button class="btn btn-secondary">Continue shopping</button>
  <button class="btn btn-tertiary">Learn more</button>
  <button class="btn btn-disabled" disabled>Unavailable</button>
</div>
<div class="hairline" style="margin:18px 0"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <button class="btn btn-primary" style="padding:16px 28px;font-size:18px">Check out · $42.98</button>
  <button class="btn btn-primary" style="padding:8px 14px;font-size:14px">Save</button>
  <button class="btn btn-secondary" style="padding:8px 14px;font-size:14px">Cancel</button>
</div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Product card</title>
<link rel="stylesheet" href="_card.css">
<style>
.pc{width:200px;background:#fff;border-radius:8px;border:1px solid var(--ld-gray-20);padding:12px;font-family:var(--ld-font-sans)}
.pc .img{height:140px;background:var(--ld-gray-5);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ld-gray-50);font:400 12px/1 var(--ld-font-mono);margin-bottom:8px;position:relative}
.tag{position:absolute;top:8px;left:8px;background:var(--ld-spark-100);color:var(--ld-gray-170);font:700 11px/1 var(--ld-font-sans);padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:0.02em}
.price{font:700 22px/1 var(--ld-font-sans);color:var(--ld-text)}
.was{font:400 12px/1 var(--ld-font-sans);color:var(--ld-text-subtle);text-decoration:line-through;margin-left:6px}
.name{font:400 14px/18px var(--ld-font-sans);color:var(--ld-text);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rating{font:400 12px/1 var(--ld-font-sans);color:var(--ld-text-subtle);margin-top:6px}
.add{margin-top:12px;width:100%;background:var(--ld-blue-100);color:#fff;border:none;border-radius:1000px;padding:10px;font:700 14px/1 var(--ld-font-sans);cursor:pointer}
</style></head>
<body><div class="card" style="background:var(--ld-bg-subtle)">
<div style="display:flex;gap:14px">
  <div class="pc"><div class="img"><div class="tag">Rollback</div>Product image</div><div><span class="price">$4.98</span><span class="was">$6.98</span></div><div class="name">Great Value whole milk, vitamin D, 1 gallon</div><div class="rating">★ 4.7 (12,041)</div><button class="add">Add to cart</button></div>
  <div class="pc"><div class="img">Product image</div><div><span class="price">$28.98</span></div><div class="name">Hanes Men's comfort-fit t-shirt, 4-pack</div><div class="rating">★ 4.5 (3,221)</div><button class="add">Add to cart</button></div>
  <div class="pc"><div class="img"><div class="tag" style="background:var(--ld-red-100);color:#fff">Clearance</div>Product image</div><div><span class="price">$12.50</span><span class="was">$29.99</span></div><div class="name">Mainstays 3-piece kitchen towel set, gray</div><div class="rating">★ 4.8 (842)</div><button class="add">Add to cart</button></div>
</div>
</div></body></html>

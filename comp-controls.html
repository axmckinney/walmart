<!doctype html><html><head><meta charset="utf-8"><title>Selection controls</title>
<link rel="stylesheet" href="_card.css">
<style>
.row{display:flex;gap:24px;align-items:center;margin-bottom:14px}
.rad,.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--ld-gray-100);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.chk{border-radius:4px}
.on{border-color:var(--ld-blue-100);background:var(--ld-blue-100)}
.rad.on::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.chk.on::after{content:'';width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.sw{width:40px;height:22px;border-radius:1000px;background:var(--ld-gray-30);position:relative;flex:0 0 auto;transition:background 150ms}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left 150ms}
.sw.on{background:var(--ld-blue-100)}
.sw.on::after{left:20px}
.lbl{font:400 16px/1 var(--ld-font-sans);color:var(--ld-text)}
</style></head>
<body><div class="card">
<div class="row"><span class="rad on"></span><span class="lbl">Free pickup today</span><span class="rad"></span><span class="lbl">Shipping, arrives tomorrow</span></div>
<div class="row"><span class="chk on"></span><span class="lbl">Walmart+ member</span><span class="chk"></span><span class="lbl">Save payment method</span></div>
<div class="row"><span class="sw on"></span><span class="lbl">Text me when it ships</span><span class="sw"></span><span class="lbl">Email marketing</span></div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:var(--ld-bg-subtle);padding:40px 28px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
<div><div style="height:96px;background:var(--ld-white);border-radius:12px;box-shadow:var(--ld-elevation-100)"></div><div class="label" style="margin-top:10px">elevation-100</div><div class="value">cards</div></div>
<div><div style="height:96px;background:var(--ld-white);border-radius:12px;box-shadow:var(--ld-elevation-200)"></div><div class="label" style="margin-top:10px">elevation-200</div><div class="value">sticky headers</div></div>
<div><div style="height:96px;background:var(--ld-white);border-radius:12px;box-shadow:var(--ld-elevation-300)"></div><div class="label" style="margin-top:10px">elevation-300</div><div class="value">popovers, modals</div></div>
</div>
</div></body></html>

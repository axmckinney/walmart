<!doctype html><html><head><meta charset="utf-8"><title>Colors — Semantic status</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
  <div><div style="height:56px;background:var(--ld-fill-positive);border-radius:8px"></div><div style="margin-top:8px"><div class="label">positive</div><div class="value">green-100</div></div><div style="margin-top:6px;height:32px;background:var(--ld-fill-positive-subtle);border-radius:6px"></div></div>
  <div><div style="height:56px;background:var(--ld-fill-negative);border-radius:8px"></div><div style="margin-top:8px"><div class="label">negative</div><div class="value">red-100</div></div><div style="margin-top:6px;height:32px;background:var(--ld-fill-negative-subtle);border-radius:6px"></div></div>
  <div><div style="height:56px;background:var(--ld-fill-warning);border-radius:8px"></div><div style="margin-top:8px"><div class="label">warning</div><div class="value">spark-100</div></div><div style="margin-top:6px;height:32px;background:var(--ld-fill-warning-subtle);border-radius:6px"></div></div>
  <div><div style="height:56px;background:var(--ld-fill-info);border-radius:8px"></div><div style="margin-top:8px"><div class="label">info</div><div class="value">blue-100</div></div><div style="margin-top:6px;height:32px;background:var(--ld-fill-info-subtle);border-radius:6px"></div></div>
</div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Colors — Accents</title>
<link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;">
<template id="t"></template>
</div>
<script>
const families = ['green','red','orange','pink','purple','teal','cyan'];
const root = document.querySelector('.card > div');
root.innerHTML = families.map(f => `
  <div>
    <div style="height:72px;background:var(--ld-${f}-100);border-radius:8px"></div>
    <div style="margin-top:8px" class="label">${f}</div>
    <div class="value">-100</div>
    <div style="margin-top:6px;display:flex;gap:4px">
      <div style="flex:1;height:20px;background:var(--ld-${f}-10);border-radius:4px;border:1px solid var(--ld-gray-20)"></div>
      <div style="flex:1;height:20px;background:var(--ld-${f}-50);border-radius:4px"></div>
    </div>
  </div>`).join('');
</script>
</div></body></html>

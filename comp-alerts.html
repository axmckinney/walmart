<!doctype html><html><head><meta charset="utf-8"><title>Alerts</title>
<link rel="stylesheet" href="_card.css">
<style>
.al{display:flex;gap:12px;padding:14px 16px;border-radius:8px;align-items:flex-start;margin-bottom:10px}
.al svg{width:20px;height:20px;flex:0 0 auto;margin-top:2px}
.al .t{font:700 14px/20px var(--ld-font-sans)}
.al .d{font:400 14px/20px var(--ld-font-sans);color:var(--ld-text-subtle)}
</style></head>
<body><div class="card">
<div class="al" style="background:var(--ld-fill-info-subtle)"><img src="../assets/icons/InfoCircleFill.svg" style="width:20px;height:20px;filter:brightness(0) saturate(100%) invert(22%) sepia(99%) saturate(2200%) hue-rotate(215deg) brightness(90%) contrast(100%)"><div><div class="t" style="color:var(--ld-text-info-bold)">Delivery window updated</div><div class="d">Your groceries now arrive between 2 – 4pm today.</div></div></div>
<div class="al" style="background:var(--ld-fill-positive-subtle)"><img src="../assets/icons/CheckCircleFill.svg" style="width:20px;height:20px"><div><div class="t" style="color:var(--ld-text-positive-bold)">Order placed</div><div class="d">We'll text you when it ships.</div></div></div>
<div class="al" style="background:var(--ld-fill-warning-subtle)"><img src="../assets/icons/WarningFill.svg" style="width:20px;height:20px"><div><div class="t" style="color:var(--ld-text-warning-bold)">Only 3 left at this price</div><div class="d">Add to cart soon — this Rollback ends Friday.</div></div></div>
<div class="al" style="background:var(--ld-fill-negative-subtle)"><img src="../assets/icons/ExclamationCircleFill.svg" style="width:20px;height:20px"><div><div class="t" style="color:var(--ld-text-negative-bold)">Payment declined</div><div class="d">Try a different card or update your billing address.</div></div></div>
</div></body></html>

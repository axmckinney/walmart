<!doctype html><html><head><meta charset="utf-8"><title>Badges & pills</title>
<link rel="stylesheet" href="_card.css">
<style>
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:1000px;font:700 12px/1 var(--ld-font-sans);}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font:700 11px/1 var(--ld-font-sans);text-transform:uppercase;letter-spacing:0.02em}
</style></head>
<body><div class="card">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
  <span class="tag" style="background:var(--ld-spark-100);color:var(--ld-gray-170)">Rollback</span>
  <span class="tag" style="background:var(--ld-red-100);color:#fff">Clearance</span>
  <span class="tag" style="background:var(--ld-gray-170);color:#fff">Walmart+</span>
  <span class="tag" style="background:var(--ld-blue-10);color:var(--ld-blue-130)">Best seller</span>
  <span class="tag" style="background:var(--ld-green-10);color:var(--ld-green-130)">In stock</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
  <span class="pill" style="background:var(--ld-gray-5);color:var(--ld-text)">Free shipping</span>
  <span class="pill" style="background:var(--ld-blue-10);color:var(--ld-blue-130)">Get it by Thu</span>
  <span class="pill" style="background:var(--ld-green-10);color:var(--ld-green-130)">●  Saved $3.00</span>
  <span class="pill" style="background:var(--ld-red-10);color:var(--ld-red-130)">Only 3 left</span>
  <span class="pill" style="background:var(--ld-fill-inverse);color:#fff">In 18 carts</span>
</div>
</div></body></html>
